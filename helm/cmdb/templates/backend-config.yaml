apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  DB_HOST: {{ .Values.backend.database.host | quote }}
  DB_PORT: {{ .Values.backend.database.port | quote }}
  DB_NAME: {{ .Values.backend.database.name | quote }}
  DB_USER: {{ .Values.backend.database.username | quote }}
  SERVER_PORT: {{ .Values.backend.port | quote }}
  APP_SEED_ENABLED: {{ .Values.backend.seedEnabled | quote }}
  DB_POOL_SIZE: {{ .Values.backend.database.poolSize | quote }}
