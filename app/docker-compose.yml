# Local stack: PostgreSQL + backend + frontend.
#   cp .env.example .env   (then adjust values)
#   docker compose up --build
name: cmdb

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-cmdb}
      POSTGRES_USER: ${DB_USER:-cmdb}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Intentionally not published to the host: only the backend can reach the database.

  backend:
    build: ./backend
    image: cmdb-backend:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cmdb}
      DB_USER: ${DB_USER:-cmdb}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8080"   # direct API / Swagger access for debugging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: cmdb-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-8082}:80"
    restart: unless-stopped

volumes:
  postgres-data:
