spring:
  application:
    name: cmdb-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cmdb}
    username: ${DB_USER:cmdb}
    password: ${DB_PASSWORD}   # no default on purpose: injected via env / Kubernetes Secret
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate       # schema is owned by Flyway migrations
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}   # inserts sample servers when the table is empty
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
