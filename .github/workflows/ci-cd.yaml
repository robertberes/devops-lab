
name: CMDB CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app/frontend/**"
      - "app/backend/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmdb-cd
  cancel-in-progress: false

jobs:
  test:
    name: Test applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test backend
        working-directory: app/backend
        run: mvn -B test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Test frontend
        working-directory: app/frontend
        run: npm test

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build

  build-and-push:
    name: Build and publish images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (linux/arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./app/frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/robertberes/cmdb-frontend:sha-${{ github.sha }}
            ghcr.io/robertberes/cmdb-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./app/backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/robertberes/cmdb-backend:sha-${{ github.sha }}
            ghcr.io/robertberes/cmdb-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Update Helm image tags
        env:
          TAG: sha-${{ github.sha }}
        run: |
          git pull --rebase origin main
          sed -i -E \
            -e "/^frontend:/,/^backend:/ s|^(    tag: )[^ #]+|\1${TAG}|" \
            -e "/^backend:/,/^postgresql:/ s|^(    tag: )[^ #]+|\1${TAG}|" \
            helm/cmdb/values.yaml

          test "$(grep -c "^    tag: ${TAG}" helm/cmdb/values.yaml)" = "2" \
            || { echo "::error::expected exactly 2 image tags to be updated"; exit 1; }

      - name: Commit updated Helm values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/cmdb/values.yaml

          if ! git diff --cached --quiet; then
            git commit -m "update CMDB images to sha-${GITHUB_SHA} [skip ci]"
            git push origin HEAD:main
          fi
