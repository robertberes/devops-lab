apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cmdb
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:robertberes/devops-lab.git
    targetRevision: main
    path: helm/cmdb

  destination:
    server: https://kubernetes.default.svc
    namespace: cmdb

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
