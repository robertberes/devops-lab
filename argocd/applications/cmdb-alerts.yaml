apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cmdb-alerts
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:robertberes/devops-lab.git
    targetRevision: main
    path: infra/monitoring/rules

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
